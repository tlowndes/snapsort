name: Build

# Builds the Windows installer and portable exe for every pull request, so a change can be
# tried before it's released. Download them from the run's Artifacts section.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Snapsort-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
